<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정밀 STT(녹음 텍스트 변환) - Google AI Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="index.html" class="back-link">← 메인으로 돌아가기</a>
            </div>
            <h1>정밀 STT 도구 <span class="badge">Gemini 1.5 Flash</span></h1>
            <p>녹음 파일을 텍스트(대화 글)로 아주 정확하게 변환합니다. 전문 용어와 숫자 보존에 최적화되어 있습니다.</p>
        </header>

        <section class="card settings">
            <div class="input-group">
                <label for="api-key">Google AI Studio API Key</label>
                <input type="password" id="api-key" placeholder="API 키를 입력하세요">
                <button id="save-key" class="secondary-btn">저장</button>
            </div>
        </section>

        <main class="card upload-section">
            <div id="drop-zone" class="drop-zone">
                <!-- 자바스크립트 없이도 작동하도록 input을 가장 앞으로 배치 -->
                <input type="file" id="file-input" class="file-input-overlay" accept="audio/*">
                <span class="icon">🎙️</span>
                <p>녹음 파일(mp3, m4a, wav 등)을 여기에 드래그하거나 클릭하여 업로드하세요.</p>
            </div>

            <div id="file-info" class="file-info hidden">
                <span id="file-name" class="file-name">파일명.mp3</span>
                <button id="remove-file" class="remove-btn">✕</button>
            </div>

            <button id="transcribe-btn" class="primary-btn" disabled>변환 시작하기</button>
        </main>

        <section id="result-section" class="card result-section hidden">
            <div class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>AI가 음성을 정밀하게 받아쓰기 하고 있습니다. 잠시만 기다려 주세요...</p>
            </div>

            <div id="transcription-content">
                <div class="header-with-action">
                    <h2>변환된 텍스트</h2>
                    <div class="actions">
                        <button id="copy-btn" class="small-btn">📋 전체 복사</button>
                        <button id="save-txt-btn" class="small-btn">💾 파일 저장</button>
                    </div>
                </div>
                <div id="transcript-box" class="text-box full-height"></div>
            </div>
        </section>

        <footer>
            <p>© 2026 대화 맥락 분석기 - 고정밀 STT 모듈</p>
        </footer>
    </div>

    <script src="stt.js"></script>
</body>
</html>
