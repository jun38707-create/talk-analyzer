<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대화 맥락 분석기 - Google AI Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="stt.html" class="back-link">🚀 정밀 STT 도구로 이동 (받아쓰기)</a>
            </div>
            <h1>대화 맥락 분석기 <span class="badge">Gemini 1.5 Flash</span></h1>
            <p>녹음 파일이나 대화 내용을 업로드하여 맥락과 핵심 주장을 분석하세요.</p>
        </header>

        <section class="card settings">
            <div class="input-group">
                <label for="api-key">Google AI Studio API Key</label>
                <input type="password" id="api-key" placeholder="API 키를 입력하세요">
                <button id="save-key" class="secondary-btn">저장</button>
            </div>
        </section>

        <main class="card upload-section">
            <div id="drop-zone" class="drop-zone">
                <!-- 자바스크립트 없이도 작동하도록 input을 가장 앞으로 배치 -->
                <input type="file" id="file-input" class="file-input-overlay" accept="audio/*,text/plain">
                <span class="icon">📁</span>
                <p>메모, 녹음 파일 또는 텍스트 파일을 여기에 드래그하거나 클릭하여 업로드하세요.</p>
                <p class="support-text">지원 형식: m4a, mp3, txt 등</p>
            </div>

            <div id="file-info" class="file-info hidden">
                <span id="file-name" class="file-name">파일명.mp3</span>
                <button id="remove-file" class="remove-btn">✕</button>
            </div>

            <button id="analyze-btn" class="primary-btn" disabled>분석 시작하기</button>
        </main>

        <section id="result-section" class="card result-section hidden">
            <div class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>AI가 대화를 분석 중입니다. 잠시만 기다려 주세요...</p>
            </div>

            <div id="analysis-content">
                <div class="header-with-action">
                    <h2>분석 리포트</h2>
                    <div class="actions">
                        <button id="copy-btn" class="small-btn">📋 전체 복사</button>
                        <button id="save-txt-btn" class="small-btn">💾 파일 저장</button>
                    </div>
                </div>
                
                <div class="summary-grid">
                    <div class="summary-item mine">
                        <h3>나의 핵심 주장</h3>
                        <div id="my-argument" class="text-box"></div>
                    </div>
                    <div class="summary-item other">
                        <h3>상대방의 핵심 주장</h3>
                        <div id="other-argument" class="text-box"></div>
                    </div>
                </div>

                <div class="summary-item context-box">
                    <h3>전체 맥락 요약</h3>
                    <div id="context-summary" class="text-box"></div>
                </div>
            </div>
        </section>

        <footer>
            <p>© 2026 대화 맥락 분석기 - 데스크탑 및 모바일 지원</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
